name: Feature request
description: Suggest an enhancement or new capability for Mobiscroll UI or Mobiscroll Connect
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! This covers any part of Mobiscroll - the open-source
        components in this repo, the commercial Mobiscroll UI components, and Mobiscroll
        Connect (API and SDKs). Please give us as much detail as you can.

  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which product does this relate to?
      multiple: true
      options:
        - Mobiscroll UI
        - Mobiscroll Connect API
        - Mobiscroll Connect SDK
        - Not applicable / all
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package / SDK
      description: Which framework package(s) or SDK language(s) does this relate to?
      multiple: true
      options:
        - React
        - Angular
        - Vue
        - JavaScript
        - jQuery
        - Node.js SDK
        - PHP SDK
        - .NET SDK
        - Python SDK
        - Java SDK
        - Go SDK
        - Ruby SDK
        - Not applicable / all
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or limitation you're running into.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Include API/usage examples if you have them.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've tried.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help us understand the request.
    validations:
      required: false
